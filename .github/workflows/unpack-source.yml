name: Import Verse source

on:
  push:
    branches:
      - main
    paths:
      - Verse-source.zip

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: |
          unzip -o Verse-source.zip -d .
          rm Verse-source.zip
          rm .github/workflows/unpack-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Verse project source"
          git push
